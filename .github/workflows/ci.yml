name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build, Test and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Strict No-Emoji Policy
        run: |
          echo "Verifying no emojis exist in codebase, comments, or documentation..."
          if git grep -I -P "[\x{1F300}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]" -- ':!*.jar' ':!*.xlsx' ':!*.zip' ':!gradle/wrapper/*'; then
            echo "ERROR: Found emojis in the repository. Emojis are strictly forbidden by project rules."
            exit 1
          fi
          echo "No-emoji check passed successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Dependency & Wrapper Caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: ./gradlew test --info

      - name: Build Artifacts (JAR and Sources)
        run: ./gradlew assemble

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

      - name: Archive Release JARs on Main
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sheetstream-release-jars
          path: build/libs/*.jar
          retention-days: 14
